version: "3.9"

services:
  bot:
    build: .
    container_name: brodobrey_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./brodobrey.db:/app/brodobrey.db
      - ./logs:/app/logs
    ports:
      - "8080:8080"   # вебхук ЮKassa
    environment:
      - TZ=Europe/Moscow